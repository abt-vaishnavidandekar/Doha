[project]
name = "enrollemnt-management"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abt-vaishnavidandekar", email = "abt.vaishnavidandekar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
enrollemnt-management = "enrollemnt_management:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
